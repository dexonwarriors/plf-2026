name: PLF Auto-Update

on:
  repository_dispatch:
    types: [run-plf-update]
  workflow_dispatch:

jobs:
  update-score-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Bibliotheken installieren
        run: |
          pip install pandas espn_api requests

      - name: PLF Skript ausführen
        run: python PLF.py
